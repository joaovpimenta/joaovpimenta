name: Project Governance Verify Temporary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/project-governance-apply-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_OWNER: ${{ vars.DEVELOPMENT_HQ_PROJECT_OWNER || 'joaovpimenta' }}
      PROJECT_NUMBER: ${{ vars.DEVELOPMENT_HQ_PROJECT_NUMBER || '2' }}
      GH_TOKEN: ${{ secrets.PROJECT_SCANNER_TOKEN }}

    steps:
      - name: Validate secret and mask it
        shell: bash
        run: |
          set +x
          test -n "$GH_TOKEN" || { echo 'Missing required secret PROJECT_SCANNER_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$GH_TOKEN"

      - name: Verify Project schema
        shell: bash
        run: |
          set +x
          node <<'NODE'
          const query = `query($login:String!,$number:Int!){
            user(login:$login){
              projectV2(number:$number){
                title
                fields(first:100){
                  nodes{
                    __typename
                    ... on ProjectV2Field { name dataType }
                    ... on ProjectV2SingleSelectField { name dataType options { name } }
                    ... on ProjectV2MultiSelectField { name dataType multiSelectOptions { name } }
                  }
                }
                views(first:100){
                  nodes { name layout filter }
                }
              }
            }
          }`;
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'content-type': 'application/json',
              'x-github-api-version': '2026-03-10'
            },
            body: JSON.stringify({query, variables: {login: process.env.PROJECT_OWNER, number: Number(process.env.PROJECT_NUMBER)}})
          });
          const json = await response.json();
          if (!response.ok || json.errors?.length) {
            console.error('Verification query failed.');
            process.exit(1);
          }
          const project = json.data.user?.projectV2;
          if (!project) {
            console.error('Project not found.');
            process.exit(1);
          }
          console.log('Project:', project.title);
          console.log('FIELDS');
          for (const field of project.fields.nodes) {
            const options = field.options || field.multiSelectOptions || [];
            if (['Status','Priority','Work Type','Area','Organization','Product','Repository'].includes(field.name)) {
              console.log(`${field.name} | ${field.__typename} | ${options.map(x=>x.name).join(',')}`);
            }
          }
          console.log('VIEWS');
          for (const view of project.views.nodes) {
            if (['Command Center','Now','Triage','By Repository','Pull Requests','Recently Done'].includes(view.name)) {
              console.log(`${view.name} | ${view.layout} | ${view.filter || ''}`);
            }
          }
          NODE
