name: Project Governance Apply Temporary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/project-governance-apply-temp.yml'
      - 'scripts/project-governance.mjs'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_OWNER: ${{ vars.DEVELOPMENT_HQ_PROJECT_OWNER || 'joaovpimenta' }}
      PROJECT_NUMBER: ${{ vars.DEVELOPMENT_HQ_PROJECT_NUMBER || '2' }}
      DRY_RUN: 'false'
      GH_TOKEN: ${{ secrets.PROJECT_SCANNER_TOKEN }}

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secret and mask it
        shell: bash
        run: |
          set +x
          test -n "$GH_TOKEN" || { echo 'Missing required secret PROJECT_SCANNER_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$GH_TOKEN"

      - name: Apply Project governance
        shell: bash
        run: |
          set +x
          node scripts/project-governance.mjs
