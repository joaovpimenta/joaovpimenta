name: Governance Event

on:
  workflow_call:
    inputs:
      policy_ref:
        description: 'Pinned tag or commit SHA in joaovpimenta/joaovpimenta'
        required: false
        default: 'governance-v1.0.0'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  normalize:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch pinned governance policy and worker
        shell: bash
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
        run: |
          set -euo pipefail
          ctrl_dir="$RUNNER_TEMP/governance-control-plane"
          rm -rf "$ctrl_dir"
          git clone --depth 1 --branch "$POLICY_REF" https://github.com/joaovpimenta/joaovpimenta.git "$ctrl_dir"
          test -f "$ctrl_dir/scripts/governance-event.mjs"
          test -f "$ctrl_dir/governance/taxonomy.json"

      - name: Reconcile issue metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_POLICY_PATH: ${{ runner.temp }}/governance-control-plane/governance/taxonomy.json
        run: |
          set +x
          node "$RUNNER_TEMP/governance-control-plane/scripts/governance-event.mjs"
