name: Issue Classification Retrofit Temporary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/issue-classification-retrofit-temp.yml'
      - 'scripts/issue-classification-retrofit.mjs'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: \${{ secrets.PROJECT_SCANNER_TOKEN }}
      PROJECT_OWNER: \${{ vars.DEVELOPMENT_HQ_PROJECT_OWNER || 'joaovpimenta' }}
      PROJECT_NUMBER: \${{ vars.DEVELOPMENT_HQ_PROJECT_NUMBER || '2' }}
      DRY_RUN: 'false'

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secret and mask it
        shell: bash
        run: |
          set +x
          test -n "$GH_TOKEN" || { echo 'Missing required secret PROJECT_SCANNER_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$GH_TOKEN"

      - name: Classify historical issues
        shell: bash
        run: |
          set +x
          node scripts/issue-classification-retrofit.mjs

      - name: Mirror classification into Project
        shell: bash
        run: |
          set +x
          node scripts/project-governance.mjs
