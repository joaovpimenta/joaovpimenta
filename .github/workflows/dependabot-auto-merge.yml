# =============================================================================
# Dependabot Auto-Merge (Reusable Workflow)
# =============================================================================
# Habilita auto-merge (squash) SOMENTE para PRs abertos por `dependabot[bot]`
# com atualização semver-minor ou semver-patch (NUNCA semver-major).
#
# Segurança:
# - Não faz checkout do código do PR (seguro com `pull_request_target`).
# - Usa `dependabot/fetch-metadata` pinado por SHA completo.
# - O merge real só acontece depois que todos os status checks obrigatórios
#   do Ruleset do repositório (testes unitários, cobertura, Qlty, segurança)
#   passarem.
# =============================================================================
name: Dependabot Auto-Merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: dependabot-auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request != null }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Enable squash auto-merge for minor/patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL"
