name: Governance Full Apply Temporary # retry-empty-repos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/governance-full-apply-temp.yml'

concurrency:
  group: development-hq-full-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_OWNER: ${{ vars.DEVELOPMENT_HQ_PROJECT_OWNER || 'joaovpimenta' }}
      PROJECT_NUMBER: ${{ vars.DEVELOPMENT_HQ_PROJECT_NUMBER || '2' }}
      LOOKBACK_MINUTES: '180'
      REPO_ALLOWLIST: ${{ vars.DEVELOPMENT_HQ_REPO_ALLOWLIST }}
      REPO_DENYLIST: ${{ vars.DEVELOPMENT_HQ_REPO_DENYLIST }}
      MIN_PERMISSION: ${{ vars.DEVELOPMENT_HQ_MIN_PERMISSION || 'push' }}
      INCLUDE_ISSUES: 'true'
      INCLUDE_PRS: 'true'
      LOG_LEVEL: 'info'
      BACKFILL_OPEN: 'false'
      RETROFIT_HISTORY: 'true'
      DRY_RUN: 'false'
      GH_TOKEN: ${{ secrets.PROJECT_SCANNER_TOKEN }}

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secret and mask it
        shell: bash
        run: |
          set +x
          test -n "$GH_TOKEN" || { echo 'Missing required secret PROJECT_SCANNER_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$GH_TOKEN"

      - name: Apply repository governance to full history
        shell: bash
        run: |
          set +x
          node scripts/governance-reconcile.mjs

      - name: Backfill all historical work into Project
        shell: bash
        run: |
          set +x
          node scripts/development-hq-sync.mjs

      - name: Reconcile Project metadata
        shell: bash
        run: |
          set +x
          node scripts/project-governance.mjs
