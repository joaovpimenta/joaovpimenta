name: Project Field Cleanup Temporary

on:
  push:
    branches: [main]
    paths: ['.github/workflows/project-field-cleanup-temp.yml']

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PROJECT_SCANNER_TOKEN }}
      PROJECT_OWNER: joaovpimenta
      PROJECT_NUMBER: '2'
    steps:
      - name: Validate secret
        shell: bash
        run: |
          set +x
          test -n "$GH_TOKEN" || { echo "Missing cleanup credential"; exit 1; }
          echo "::add-mask::$GH_TOKEN"

      - name: Clean obsolete fields and migrate Team to Organization
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const token = process.env.GH_TOKEN;
          const owner = process.env.PROJECT_OWNER;
          const number = Number(process.env.PROJECT_NUMBER);

          async function gql(query, variables) {
            const r = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/vnd.github+json',
                'content-type': 'application/json',
                'user-agent': 'development-hq-field-cleanup'
              },
              body: JSON.stringify({ query, variables })
            });
            if (!r.ok) throw new Error(`GraphQL HTTP ${r.status}`);
            const j = await r.json();
            if (j.errors?.length) throw new Error('GraphQL operation rejected');
            return j.data;
          }

          const data = await gql(`
            query($login:String!,$number:Int!){
              user(login:$login){
                projectV2(number:$number){
                  id
                  fields(first:100){
                    nodes{
                      __typename
                      ... on ProjectV2FieldCommon { id name }
                    }
                  }
                  items(first:100){
                    nodes{
                      id
                      content{
                        __typename
                        ... on Issue { repository { owner { login } } }
                        ... on PullRequest { repository { owner { login } } }
                      }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }`, { login: owner, number });

          const project = data.user?.projectV2;
          if (!project) throw new Error('Project unavailable');

          const obsoleteNames = new Set(['Quarter','Iteration','Start date','Target date']);
          const fields = project.fields.nodes || [];
          let deleted = 0;

          for (const f of fields) {
            if (!obsoleteNames.has(f.name)) continue;
            await gql(
              `mutation($fieldId:ID!){
                deleteProjectV2Field(input:{fieldId:$fieldId}){ projectV2Field{ ... on ProjectV2FieldCommon { id } } }
              }`,
              { fieldId: f.id }
            );
            deleted++;
          }

          const team = fields.find(f => f.name === 'Team');
          let organization = fields.find(f => f.name === 'Organization');

          if (team) {
            await gql(
              `mutation($fieldId:ID!){
                deleteProjectV2Field(input:{fieldId:$fieldId}){ projectV2Field{ ... on ProjectV2FieldCommon { id } } }
              }`,
              { fieldId: team.id }
            );
            deleted++;
          }

          // Collect all item owners without logging names.
          const owners = new Set();
          let itemNodes = [...(project.items.nodes || [])];
          let after = project.items.pageInfo?.endCursor || null;
          while (project.items.pageInfo?.hasNextPage && after) {
            const more = await gql(`
              query($id:ID!,$after:String){
                node(id:$id){
                  ... on ProjectV2 {
                    items(first:100,after:$after){
                      nodes{
                        id
                        content{
                          __typename
                          ... on Issue { repository { owner { login } } }
                          ... on PullRequest { repository { owner { login } } }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }`, { id: project.id, after });
            const conn = more.node?.items;
            if (!conn) break;
            itemNodes.push(...(conn.nodes || []));
            if (!conn.pageInfo?.hasNextPage) break;
            after = conn.pageInfo.endCursor;
          }

          for (const item of itemNodes) {
            const login = item.content?.repository?.owner?.login;
            if (login) owners.add(login);
          }

          if (!organization) {
            const colors = ['BLUE','GREEN','PURPLE','ORANGE','PINK','YELLOW','RED','GRAY'];
            const options = [...owners].sort().map((name, i) => ({
              name,
              description: 'Repository owner',
              color: colors[i % colors.length]
            }));

            const created = await gql(`
              mutation($projectId:ID!,$options:[ProjectV2SingleSelectFieldOptionInput!]!){
                createProjectV2Field(input:{
                  projectId:$projectId,
                  dataType:SINGLE_SELECT,
                  name:"Organization",
                  singleSelectOptions:$options
                }){
                  projectV2Field{
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }`, { projectId: project.id, options });
            organization = created.createProjectV2Field?.projectV2Field;
          } else {
            const current = await gql(`
              query($id:ID!){
                node(id:$id){
                  ... on ProjectV2SingleSelectField { id options { id name color description } }
                }
              }`, { id: organization.id });
            organization = current.node;
          }

          if (!organization?.id) throw new Error('Organization field unavailable');

          // Ensure current owners are represented as options.
          const currentByName = new Map((organization.options || []).map(o => [o.name, o]));
          const missing = [...owners].filter(name => !currentByName.has(name));
          if (missing.length) {
            const colors = ['BLUE','GREEN','PURPLE','ORANGE','PINK','YELLOW','RED','GRAY'];
            const preserved = (organization.options || []).map(o => ({
              id: o.id,
              name: o.name,
              color: o.color,
              description: o.description
            }));
            const added = missing.sort().map((name, i) => ({
              name,
              color: colors[(preserved.length + i) % colors.length],
              description: 'Repository owner'
            }));

            const updated = await gql(`
              mutation($fieldId:ID!,$options:[ProjectV2SingleSelectFieldOptionInput!]!){
                updateProjectV2Field(input:{fieldId:$fieldId,singleSelectOptions:$options}){
                  projectV2Field{
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }`, { fieldId: organization.id, options: [...preserved, ...added] });
            organization = updated.updateProjectV2Field?.projectV2Field;
          }

          const optionByName = new Map((organization.options || []).map(o => [o.name, o.id]));
          let assigned = 0;
          for (const item of itemNodes) {
            const login = item.content?.repository?.owner?.login;
            const optionId = optionByName.get(login);
            if (!optionId) continue;
            await gql(`
              mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                updateProjectV2ItemFieldValue(input:{
                  projectId:$projectId,
                  itemId:$itemId,
                  fieldId:$fieldId,
                  value:{singleSelectOptionId:$optionId}
                }){ projectV2Item { id } }
              }`, {
                projectId: project.id,
                itemId: item.id,
                fieldId: organization.id,
                optionId
              });
            assigned++;
          }

          console.log('Project field cleanup complete');
          console.log(`Fields removed: ${deleted}`);
          console.log(`Organization options: ${owners.size}`);
          console.log(`Items categorized by organization: ${assigned}`);
          NODE
