name: Quality Gate (Qlty CLI)

on:
  workflow_call:
    inputs:
      scope_override:
        description: 'Optional manual override for project QLTY_SCOPE (pr or full)'
        required: false
        default: ''
        type: string
      enforcement_override:
        description: 'Optional manual override for project QLTY_ENFORCEMENT (report-only, standard, or strict)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  qlty:
    name: qlty-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QLTY_TELEMETRY: 'off'
    steps:
      - name: Validate required project environment variables
        id: config
        shell: bash
        env:
          VAR_QLTY_SCOPE: ${{ vars.QLTY_SCOPE }}
          VAR_QLTY_ENFORCEMENT: ${{ vars.QLTY_ENFORCEMENT }}
          VAR_QLTY_VERSION: ${{ vars.QLTY_VERSION }}
          VAR_QLTY_POLICY_REF: ${{ vars.QLTY_POLICY_REF }}
          VAR_QLTY_ENABLE_SMELLS: ${{ vars.QLTY_ENABLE_SMELLS }}
          VAR_QLTY_ENABLE_METRICS: ${{ vars.QLTY_ENABLE_METRICS }}
          VAR_QLTY_ADVISORY_PLUGINS: ${{ vars.QLTY_ADVISORY_PLUGINS }}
          VAR_QLTY_BLOCK_SMELLS: ${{ vars.QLTY_BLOCK_SMELLS }}
          VAR_QLTY_ARTIFACT_RETENTION_DAYS: ${{ vars.QLTY_ARTIFACT_RETENTION_DAYS }}
          INPUT_SCOPE_OVERRIDE: ${{ inputs.scope_override }}
          INPUT_ENFORCEMENT_OVERRIDE: ${{ inputs.enforcement_override }}
        run: |
          set -euo pipefail
          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          scope="$(trim "${VAR_QLTY_SCOPE:-}")"
          enforcement="$(trim "${VAR_QLTY_ENFORCEMENT:-}")"
          qlty_version="$(trim "${VAR_QLTY_VERSION:-}")"
          policy_ref="$(trim "${VAR_QLTY_POLICY_REF:-}")"
          enable_smells="$(trim "${VAR_QLTY_ENABLE_SMELLS:-}")"
          enable_metrics="$(trim "${VAR_QLTY_ENABLE_METRICS:-}")"
          advisory_plugins="$(trim "${VAR_QLTY_ADVISORY_PLUGINS:-}" | tr -d '[:space:]')"
          block_smells="$(trim "${VAR_QLTY_BLOCK_SMELLS:-}")"
          retention_days="$(trim "${VAR_QLTY_ARTIFACT_RETENTION_DAYS:-}")"
          scope_override="$(trim "${INPUT_SCOPE_OVERRIDE:-}")"
          enforcement_override="$(trim "${INPUT_ENFORCEMENT_OVERRIDE:-}")"

          problems=()

          if [ -z "$scope" ]; then
            problems+=("Variável obrigatória ausente: \`QLTY_SCOPE\` (esperado: \`pr\` ou \`full\`).")
          elif [[ "$scope" != "pr" && "$scope" != "full" ]]; then
            problems+=("Valor inválido em \`QLTY_SCOPE\`: \`$scope\` (esperado: \`pr\` ou \`full\`).")
          fi

          if [ -z "$enforcement" ]; then
            problems+=("Variável obrigatória ausente: \`QLTY_ENFORCEMENT\` (esperado: \`report-only\`, \`standard\` ou \`strict\`).")
          elif [[ "$enforcement" != "report-only" && "$enforcement" != "standard" && "$enforcement" != "strict" ]]; then
            problems+=("Valor inválido em \`QLTY_ENFORCEMENT\`: \`$enforcement\` (esperado: \`report-only\`, \`standard\` ou \`strict\`).")
          fi

          if [ -z "$qlty_version" ]; then
            problems+=("Variável obrigatória ausente: \`QLTY_VERSION\` (esperado: versão SemVer sem \`v\`, ex.: \`0.672.0\`).")
          elif [[ ! "$qlty_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            problems+=("Valor inválido em \`QLTY_VERSION\`: \`$qlty_version\` (esperado: \`X.Y.Z\`, ex.: \`0.672.0\`).")
          fi

          if [ -z "$policy_ref" ]; then
            problems+=("Variável obrigatória ausente: \`QLTY_POLICY_REF\` (esperado: tag ou SHA em \`joaovpimenta/joaovpimenta\`, ex.: \`qlty-v0.2.0\`).")
          elif [[ ! "$policy_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            problems+=("Valor inválido em \`QLTY_POLICY_REF\`: \`$policy_ref\`.")
          fi

          if [ -z "$enable_smells" ]; then
            problems+=("Variável obrigatória ausente: \`QLTY_ENABLE_SMELLS\` (esperado: \`true\` ou \`false\`).")
          elif [[ "$enable_smells" != "true" && "$enable_smells" != "false" ]]; then
            problems+=("Valor inválido em \`QLTY_ENABLE_SMELLS\`: \`$enable_smells\` (esperado: \`true\` ou \`false\`).")
          fi

          if [ -z "$enable_metrics" ]; then
            problems+=("Variável obrigatória ausente: \`QLTY_ENABLE_METRICS\` (esperado: \`true\` ou \`false\`).")
          elif [[ "$enable_metrics" != "true" && "$enable_metrics" != "false" ]]; then
            problems+=("Valor inválido em \`QLTY_ENABLE_METRICS\`: \`$enable_metrics\` (esperado: \`true\` ou \`false\`).")
          fi

          if [ -z "$block_smells" ]; then
            block_smells="false"
          elif [[ "$block_smells" != "true" && "$block_smells" != "false" ]]; then
            problems+=("Valor inválido em \`QLTY_BLOCK_SMELLS\`: \`$block_smells\` (esperado: \`true\` ou \`false\`).")
          fi

          if [ -z "$retention_days" ]; then
            retention_days="7"
          elif [[ ! "$retention_days" =~ ^[0-9]+$ ]] || [ "$retention_days" -lt 1 ] || [ "$retention_days" -gt 90 ]; then
            problems+=("Valor inválido em \`QLTY_ARTIFACT_RETENTION_DAYS\`: \`$retention_days\` (esperado: inteiro entre \`1\` e \`90\`).")
          fi

          if [ -n "$advisory_plugins" ] && [[ ! "$advisory_plugins" =~ ^[A-Za-z0-9_,-]+$ ]]; then
            problems+=("Valor inválido em \`QLTY_ADVISORY_PLUGINS\`: \`$advisory_plugins\` (esperado: lista CSV de plugins).")
          fi

          if [ -n "$scope_override" ] && [[ "$scope_override" != "pr" && "$scope_override" != "full" ]]; then
            problems+=("Valor inválido em \`scope_override\`: \`$scope_override\` (esperado: \`pr\` ou \`full\`).")
          fi

          if [ -n "$enforcement_override" ] && [[ "$enforcement_override" != "report-only" && "$enforcement_override" != "standard" && "$enforcement_override" != "strict" ]]; then
            problems+=("Valor inválido em \`enforcement_override\`: \`$enforcement_override\` (esperado: \`report-only\`, \`standard\` ou \`strict\`).")
          fi

          if [ "${#problems[@]}" -gt 0 ]; then
            justification="A esteira precisa ser corrigida: variáveis de ambiente obrigatórias do Qlty estão ausentes ou inválidas neste repositório."
            echo "::error title=Esteira precisa ser corrigida::$justification"
            for problem in "${problems[@]}"; do
              echo "::error title=Variável obrigatória ausente ou inválida::$problem"
            done
            {
              echo "## Qlty Code Quality Gate — ERRO DE CONFIGURAÇÃO (A esteira precisa ser corrigida)"
              echo ""
              echo "$justification"
              echo ""
              echo "Configure as variáveis do projeto em **Settings → Secrets and variables → Actions → Variables** (ou via \`gh variable set\`)."
              echo ""
              echo "### Problemas encontrados"
              echo ""
              for problem in "${problems[@]}"; do
                echo "- $problem"
              done
              echo ""
              echo "### Variáveis obrigatórias do projeto"
              echo ""
              echo "| Variável | Valores aceitos | Exemplo |"
              echo "|---|---|---|"
              echo "| \`QLTY_SCOPE\` | \`pr\` ou \`full\` | \`pr\` |"
              echo "| \`QLTY_ENFORCEMENT\` | \`report-only\`, \`standard\` ou \`strict\` | \`standard\` |"
              echo "| \`QLTY_VERSION\` | SemVer sem \`v\` | \`0.672.0\` |"
              echo "| \`QLTY_POLICY_REF\` | Tag ou SHA em \`joaovpimenta/joaovpimenta\` | \`qlty-v0.2.0\` |"
              echo "| \`QLTY_ENABLE_SMELLS\` | \`true\` ou \`false\` | \`true\` |"
              echo "| \`QLTY_ENABLE_METRICS\` | \`true\` ou \`false\` | \`true\` |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          effective_scope="${scope_override:-$scope}"
          effective_enforcement="${enforcement_override:-$enforcement}"

          {
            echo "scope=$effective_scope"
            echo "enforcement=$effective_enforcement"
            echo "qlty_version=$qlty_version"
            echo "policy_ref=$policy_ref"
            echo "enable_smells=$enable_smells"
            echo "enable_metrics=$enable_metrics"
            echo "advisory_plugins=$advisory_plugins"
            echo "block_smells=$block_smells"
            echo "artifact_retention_days=$retention_days"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify .qlty/qlty.toml exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ".qlty/qlty.toml" ]; then
            msg="A esteira precisa ser corrigida: arquivo obrigatório .qlty/qlty.toml ausente neste repositório."
            echo "::error title=Esteira precisa ser corrigida::$msg"
            {
              echo "## Qlty Code Quality Gate — ERRO DE CONFIGURAÇÃO (A esteira precisa ser corrigida)"
              echo ""
              echo "$msg"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Cache Qlty plugins and sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.qlty/cache
            ~/.cache/qlty
          key: qlty-${{ runner.os }}-${{ steps.config.outputs.qlty_version }}-${{ hashFiles('.qlty/qlty.toml') }}
          restore-keys: |
            qlty-${{ runner.os }}-${{ steps.config.outputs.qlty_version }}-

      - name: Install and verify pinned Qlty CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QLTY_VERSION: ${{ steps.config.outputs.qlty_version }}
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/qlty-install"
          mkdir -p "$work_dir" "$RUNNER_TEMP/qlty-bin"
          archive="$work_dir/qlty-x86_64-unknown-linux-gnu.tar.xz"
          sha_file="$archive.sha256"
          base_url="https://github.com/qltysh/qlty/releases/download/v${QLTY_VERSION}"

          curl -fsSL "$base_url/qlty-x86_64-unknown-linux-gnu.tar.xz" -o "$archive"
          curl -fsSL "$base_url/qlty-x86_64-unknown-linux-gnu.tar.xz.sha256" -o "$sha_file"

          expected_sha="$(awk '{print $1}' "$sha_file")"
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$expected_sha" != "$actual_sha" ]; then
            echo "SHA-256 mismatch for Qlty CLI v${QLTY_VERSION}" >&2
            exit 1
          fi

          gh attestation verify "$archive" --repo qltysh/qlty
          tar -xJf "$archive" -C "$work_dir"
          qlty_bin="$(find "$work_dir" -type f -name qlty | head -n 1)"
          if [ -z "$qlty_bin" ]; then
            echo "Could not locate qlty binary in archive." >&2
            exit 1
          fi
          chmod +x "$qlty_bin"
          cp "$qlty_bin" "$RUNNER_TEMP/qlty-bin/qlty"
          echo "$RUNNER_TEMP/qlty-bin" >> "$GITHUB_PATH"

      - name: Fetch pinned gate evaluator from control plane
        shell: bash
        env:
          POLICY_REF: ${{ steps.config.outputs.policy_ref }}
        run: |
          set -euo pipefail
          ctrl_dir="$RUNNER_TEMP/quality-control-plane"
          rm -rf "$ctrl_dir"
          git clone --depth 1 --branch "$POLICY_REF" https://github.com/joaovpimenta/joaovpimenta.git "$ctrl_dir"
          if [ ! -f "$ctrl_dir/scripts/quality-gate.mjs" ]; then
            echo "Missing scripts/quality-gate.mjs in control plane ref $POLICY_REF." >&2
            exit 1
          fi

      - name: Resolve dynamic base ref
        id: base
        shell: bash
        env:
          QUALITY_SCOPE: ${{ steps.config.outputs.scope }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          effective_scope="$QUALITY_SCOPE"
          base_ref=""

          if [ "$QUALITY_SCOPE" = "pr" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
              if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || git fetch --no-tags origin "$PR_BASE_REF"
              fi
              base_ref="$PR_BASE_SHA"
            elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              base_ref="$PUSH_BEFORE"
            else
              effective_scope="full"
            fi
          fi

          echo "effective_scope=$effective_scope" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Run Qlty analysis
        id: run_qlty
        shell: bash
        env:
          EFFECTIVE_SCOPE: ${{ steps.base.outputs.effective_scope }}
          BASE_REF: ${{ steps.base.outputs.base_ref }}
          QUALITY_SMELLS_ENABLED: ${{ steps.config.outputs.enable_smells }}
          QUALITY_METRICS_ENABLED: ${{ steps.config.outputs.enable_metrics }}
        run: |
          set -euo pipefail
          raw_dir="$RUNNER_TEMP/quality-raw"
          art_dir="$RUNNER_TEMP/quality-artifacts"
          mkdir -p "$raw_dir" "$art_dir"

          version_line="$(qlty version --no-upgrade-check | head -n 1)"
          echo "qlty_version=$version_line" >> "$GITHUB_OUTPUT"
          echo "Installed: $version_line"

          qlty sources fetch --no-upgrade-check

          set +e
          qlty config validate --no-upgrade-check
          config_exit=$?
          set -e
          echo "config_exit=$config_exit" >> "$GITHUB_OUTPUT"

          if [ "$config_exit" -ne 0 ]; then
            echo "check_exit=2" >> "$GITHUB_OUTPUT"
            echo "smells_exit=2" >> "$GITHUB_OUTPUT"
            echo "metrics_exit=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          check_args=(check --no-fix --no-progress --print-errors --no-upgrade-check --trigger build --sarif)
          smells_args=(smells --no-snippets --no-upgrade-check --sarif)
          metrics_args=(metrics --functions --exclude-tests --no-upgrade-check)
          metrics_dir_args=(metrics --max-depth 2 --exclude-tests --no-upgrade-check)

          if [ "$EFFECTIVE_SCOPE" = "pr" ] && [ -n "$BASE_REF" ]; then
            check_args+=(--upstream "$BASE_REF")
            smells_args+=(--upstream "$BASE_REF")
            metrics_args+=(--upstream "$BASE_REF")
            metrics_dir_args+=(--upstream "$BASE_REF")
          else
            check_args+=(--all)
            smells_args+=(--all)
            metrics_args+=(--all)
            metrics_dir_args+=(--all)
          fi

          set +e
          qlty "${check_args[@]}" > "$raw_dir/check.sarif" 2> "$raw_dir/check.stderr"
          check_exit=$?
          set -e
          echo "check_exit=$check_exit" >> "$GITHUB_OUTPUT"
          if [ "$check_exit" -ne 0 ] && [ "$check_exit" -ne 1 ]; then
            echo "qlty check exited unexpectedly with code $check_exit" >&2
            tail -n 40 "$raw_dir/check.stderr" >&2 || true
          fi

          smells_exit=0
          if [ "$QUALITY_SMELLS_ENABLED" = "true" ]; then
            set +e
            qlty "${smells_args[@]}" > "$raw_dir/smells.sarif" 2> "$raw_dir/smells.stderr"
            smells_exit=$?
            set -e
            if [ "$smells_exit" -ne 0 ] && [ "$smells_exit" -ne 1 ]; then
              echo "qlty smells exited unexpectedly with code $smells_exit" >&2
              tail -n 40 "$raw_dir/smells.stderr" >&2 || true
            fi
          fi
          echo "smells_exit=$smells_exit" >> "$GITHUB_OUTPUT"

          metrics_exit=0
          if [ "$QUALITY_METRICS_ENABLED" = "true" ]; then
            set +e
            qlty "${metrics_args[@]}" > "$raw_dir/metrics-functions.txt" 2> "$raw_dir/metrics.stderr"
            metrics_exit=$?
            if [ "$metrics_exit" -eq 0 ]; then
              qlty "${metrics_dir_args[@]}" > "$art_dir/qlty-metrics-dirs.txt" 2>> "$raw_dir/metrics.stderr" || true
              cp "$raw_dir/metrics-functions.txt" "$art_dir/qlty-metrics-functions.txt"
            fi
            set -e
          fi
          echo "metrics_exit=$metrics_exit" >> "$GITHUB_OUTPUT"

      - name: Evaluate quality gate and publish summary
        id: gate
        shell: bash
        env:
          QUALITY_SCOPE: ${{ steps.base.outputs.effective_scope }}
          QUALITY_ENFORCEMENT: ${{ steps.config.outputs.enforcement }}
          QUALITY_ADVISORY_PLUGINS: ${{ steps.config.outputs.advisory_plugins }}
          QUALITY_BLOCK_SMELLS: ${{ steps.config.outputs.block_smells }}
          QUALITY_SMELLS_ENABLED: ${{ steps.config.outputs.enable_smells }}
          QUALITY_METRICS_ENABLED: ${{ steps.config.outputs.enable_metrics }}
          QUALITY_BASE_REF: ${{ steps.base.outputs.base_ref }}
          QUALITY_QLTY_VERSION: ${{ steps.run_qlty.outputs.qlty_version }}
          QUALITY_CONFIG_VALIDATE_EXIT: ${{ steps.run_qlty.outputs.config_exit }}
          QUALITY_CHECK_EXIT: ${{ steps.run_qlty.outputs.check_exit }}
          QUALITY_CHECK_SARIF: ${{ runner.temp }}/quality-raw/check.sarif
          QUALITY_SMELLS_EXIT: ${{ steps.run_qlty.outputs.smells_exit }}
          QUALITY_SMELLS_SARIF: ${{ runner.temp }}/quality-raw/smells.sarif
          QUALITY_METRICS_EXIT: ${{ steps.run_qlty.outputs.metrics_exit }}
          QUALITY_METRICS_FILE: ${{ runner.temp }}/quality-raw/metrics-functions.txt
          QUALITY_REPORT_PATH: ${{ runner.temp }}/quality-artifacts/gate-summary.json
          QUALITY_SANITIZED_CHECK_SARIF: ${{ runner.temp }}/quality-artifacts/qlty-check.sarif
          QUALITY_SANITIZED_SMELLS_SARIF: ${{ runner.temp }}/quality-artifacts/qlty-smells.sarif
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/quality-control-plane/scripts/quality-gate.mjs"

      - name: Upload sanitized quality artifacts
        if: always() && steps.config.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qlty-quality-report
          path: ${{ runner.temp }}/quality-artifacts
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(steps.config.outputs.artifact_retention_days) }}
