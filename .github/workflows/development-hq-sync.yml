name: Development HQ Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/development-hq-sync.yml'
      - 'scripts/development-hq-sync.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without changing the Project'
        required: false
        default: true
        type: boolean
      backfill_open:
        description: 'Scan all open issues and PRs instead of only the incremental window'
        required: false
        default: false
        type: boolean

concurrency:
  group: development-hq-sync
  cancel-in-progress: false

# Intentionally minimal. Cross-repository and Projects access comes only from
# the explicitly configured PROJECT_SCANNER_TOKEN secret.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_OWNER: ${{ vars.DEVELOPMENT_HQ_PROJECT_OWNER || 'joaovpimenta' }}
      PROJECT_NUMBER: ${{ vars.DEVELOPMENT_HQ_PROJECT_NUMBER || '2' }}
      LOOKBACK_MINUTES: ${{ vars.DEVELOPMENT_HQ_LOOKBACK_MINUTES || '90' }}
      REPO_ALLOWLIST: ${{ vars.DEVELOPMENT_HQ_REPO_ALLOWLIST }}
      REPO_DENYLIST: ${{ vars.DEVELOPMENT_HQ_REPO_DENYLIST }}
      MIN_PERMISSION: ${{ vars.DEVELOPMENT_HQ_MIN_PERMISSION || 'push' }}
      INCLUDE_ISSUES: ${{ vars.DEVELOPMENT_HQ_INCLUDE_ISSUES || 'true' }}
      INCLUDE_PRS: ${{ vars.DEVELOPMENT_HQ_INCLUDE_PRS || 'true' }}
      LOG_LEVEL: ${{ vars.DEVELOPMENT_HQ_LOG_LEVEL || 'info' }}
      BACKFILL_OPEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.backfill_open) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[development-hq-backfill]')) }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[development-hq-backfill]')) || (github.event_name == 'schedule' && vars.DEVELOPMENT_HQ_APPLY_ENABLED != 'true') }}
      GH_TOKEN: ${{ secrets.PROJECT_SCANNER_TOKEN }}

    steps:
      - name: Checkout automation only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secret and mask it
        shell: bash
        run: |
          set +x
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing required secret PROJECT_SCANNER_TOKEN.' >&2
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"

      - name: Sync work items
        shell: bash
        run: |
          set +x
          node scripts/development-hq-sync.mjs
