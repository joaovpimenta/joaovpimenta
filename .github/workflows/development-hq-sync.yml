name: Development HQ Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/development-hq-sync.yml'
      - '.github/workflows/governance-event.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - 'scripts/development-hq-sync.mjs'
      - 'scripts/governance-reconcile.mjs'
      - 'scripts/governance-policy.mjs'
      - 'scripts/governance-event.mjs'
      - 'scripts/project-governance.mjs'
      - 'governance/**'
  schedule:
    # 09:17, 11:17, 13:17, 15:17, 17:17 and 19:17 America/Sao_Paulo (UTC-3).
    - cron: '17 12,14,16,18,20,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without changing repositories or the Project'
        required: false
        default: true
        type: boolean
      backfill_open:
        description: 'Scan all open issues and PRs instead of only the incremental window'
        required: false
        default: false
        type: boolean
      retrofit_history:
        description: 'Scan and normalize all historical issues/PRs, including closed items'
        required: false
        default: false
        type: boolean

concurrency:
  group: development-hq-sync-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_OWNER: ${{ vars.DEVELOPMENT_HQ_PROJECT_OWNER || 'joaovpimenta' }}
      PROJECT_NUMBER: ${{ vars.DEVELOPMENT_HQ_PROJECT_NUMBER || '2' }}
      LOOKBACK_MINUTES: ${{ vars.DEVELOPMENT_HQ_LOOKBACK_MINUTES || '180' }}
      REPO_ALLOWLIST: ${{ vars.DEVELOPMENT_HQ_REPO_ALLOWLIST }}
      REPO_DENYLIST: ${{ vars.DEVELOPMENT_HQ_REPO_DENYLIST }}
      MIN_PERMISSION: ${{ vars.DEVELOPMENT_HQ_MIN_PERMISSION || 'push' }}
      INCLUDE_ISSUES: ${{ vars.DEVELOPMENT_HQ_INCLUDE_ISSUES || 'true' }}
      INCLUDE_PRS: ${{ vars.DEVELOPMENT_HQ_INCLUDE_PRS || 'true' }}
      LOG_LEVEL: ${{ vars.DEVELOPMENT_HQ_LOG_LEVEL || 'info' }}
      # Optional governance controls (configure via repository Actions Variables):
      #   DEVELOPMENT_HQ_IGNORE_FORKS    : 'true' (default) | 'false'
      #   DEVELOPMENT_HQ_WRITE_MODE      : 'pr' (default, 1 atomic PR) | 'direct'
      #   DEVELOPMENT_HQ_AUTO_MERGE      : 'safe-only' (default, owner + non-sensitive only) | 'off' | 'all'
      #   DEVELOPMENT_HQ_SYNC_VARIABLES  : 'true' (default) | 'false'
      #   DEVELOPMENT_HQ_SYNC_SETTINGS   : 'true' (default) | 'false'
      #   DEVELOPMENT_HQ_SYNC_RULESETS   : 'true' (default) | 'false'
      #   DEVELOPMENT_HQ_SYNC_DEPENDABOT : 'true' (default) | 'false'
      #   DEVELOPMENT_HQ_SYNC_AGENTS     : 'true' (default) | 'false'
      GOVERNANCE_IGNORE_FORKS: ${{ vars.DEVELOPMENT_HQ_IGNORE_FORKS || 'true' }}
      GOVERNANCE_WRITE_MODE: ${{ vars.DEVELOPMENT_HQ_WRITE_MODE || 'pr' }}
      GOVERNANCE_AUTO_MERGE: ${{ vars.DEVELOPMENT_HQ_AUTO_MERGE || 'safe-only' }}
      GOVERNANCE_SYNC_VARIABLES: ${{ vars.DEVELOPMENT_HQ_SYNC_VARIABLES || 'true' }}
      GOVERNANCE_SYNC_SETTINGS: ${{ vars.DEVELOPMENT_HQ_SYNC_SETTINGS || 'true' }}
      GOVERNANCE_SYNC_RULESETS: ${{ vars.DEVELOPMENT_HQ_SYNC_RULESETS || 'true' }}
      GOVERNANCE_SYNC_DEPENDABOT: ${{ vars.DEVELOPMENT_HQ_SYNC_DEPENDABOT || 'true' }}
      GOVERNANCE_SYNC_AGENTS: ${{ vars.DEVELOPMENT_HQ_SYNC_AGENTS || 'true' }}
      BACKFILL_OPEN: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_open }}
      RETROFIT_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.retrofit_history }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || github.event_name == 'push' }}
      GOVERNANCE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || github.event_name == 'push' }}
      GH_TOKEN: ${{ secrets.PROJECT_SCANNER_TOKEN }}

    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate secret and mask it
        shell: bash
        run: |
          set +x
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing required secret PROJECT_SCANNER_TOKEN.' >&2
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"

      - name: Reconcile repository governance
        shell: bash
        run: |
          set +x
          DRY_RUN="$GOVERNANCE_DRY_RUN" node scripts/governance-reconcile.mjs

      - name: Sync work items
        shell: bash
        run: |
          set +x
          node scripts/development-hq-sync.mjs

      - name: Reconcile Project metadata
        shell: bash
        run: |
          set +x
          DRY_RUN="$GOVERNANCE_DRY_RUN" node scripts/project-governance.mjs
