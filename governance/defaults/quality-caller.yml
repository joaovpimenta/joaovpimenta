# Reference thin caller template for participating repositories.
# Pipeline behavior is governed strictly by the target repository's GitHub Actions Variables (vars.QLTY_*).
# Required repository variables:
#   QLTY_SCOPE, QLTY_ENFORCEMENT, QLTY_VERSION, QLTY_POLICY_REF,
#   QLTY_ENABLE_SMELLS, QLTY_ENABLE_METRICS
# Optional repository variables:
#   QLTY_ADVISORY_PLUGINS, QLTY_BLOCK_SMELLS, QLTY_ARTIFACT_RETENTION_DAYS
name: Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope_override:
        description: 'Optional manual override for QLTY_SCOPE'
        required: false
        default: 'project-default'
        type: choice
        options:
          - project-default
          - pr
          - full
      enforcement_override:
        description: 'Optional manual override for QLTY_ENFORCEMENT'
        required: false
        default: 'project-default'
        type: choice
        options:
          - project-default
          - report-only
          - standard
          - strict

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: joaovpimenta/joaovpimenta/.github/workflows/quality.yml@qlty-v0.2.0
    with:
      scope_override: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_override != 'project-default' && inputs.scope_override || '' }}
      enforcement_override: ${{ github.event_name == 'workflow_dispatch' && inputs.enforcement_override != 'project-default' && inputs.enforcement_override || '' }}
